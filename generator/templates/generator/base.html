<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BlogCopier — AI Article Generator{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8cf7a;
      --dark: #1a1a2e;
      --mid: #16213e;
      --surface: #0f3460;
      --text: #e0e0e0;
      --muted: #999;
      --accent: #c9a84c;
      --radius: 8px;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }

    a { color: var(--gold-light); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── NAV ── */
    nav {
      background: var(--mid);
      border-bottom: 2px solid var(--gold);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    nav .brand {
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: .05em;
      color: var(--gold);
    }
    nav .brand span { color: var(--text); font-weight: normal; }
    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }
    nav ul a {
      color: var(--text);
      font-family: 'Arial', sans-serif;
      font-size: .9rem;
      letter-spacing: .04em;
    }
    nav ul a:hover { color: var(--gold); text-decoration: none; }

    /* ── MAIN ── */
    main {
      max-width: 860px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    h1 { font-size: 2rem; color: var(--gold); margin-bottom: .5rem; }
    h2 { font-size: 1.4rem; color: var(--gold-light); margin-bottom: .75rem; }
    p.lead { color: var(--muted); margin-bottom: 1.5rem; font-style: italic; }

    /* ── CARD ── */
    .card {
      background: var(--mid);
      border: 1px solid #2a2a4a;
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    /* ── FORM ── */
    .field { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: .4rem; font-size: .9rem; color: var(--gold-light); }
    input[type="url"], textarea {
      width: 100%;
      background: #0a0a1a;
      border: 1px solid #3a3a5a;
      border-radius: var(--radius);
      color: var(--text);
      padding: .6rem .9rem;
      font-size: 1rem;
      font-family: 'Arial', sans-serif;
      transition: border-color .2s;
    }
    input[type="url"]:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    .help { font-size: .8rem; color: var(--muted); margin-top: .3rem; }

    /* Radio group */
    .radio-group { display: flex; gap: 1.5rem; margin-bottom: 1rem; }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
      color: var(--text);
      font-size: .95rem;
    }
    input[type="radio"] { accent-color: var(--gold); }

    /* ── BUTTON ── */
    .btn {
      display: inline-block;
      background: var(--gold);
      color: #000;
      font-weight: bold;
      font-family: 'Arial', sans-serif;
      font-size: 1rem;
      letter-spacing: .06em;
      padding: .75rem 2rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn:hover { background: var(--gold-light); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    /* ── ERRORS ── */
    .errorlist { list-style: none; }
    .errorlist li {
      background: #3a0a0a;
      border-left: 3px solid #c0392b;
      color: #f39898;
      padding: .5rem .9rem;
      margin-bottom: .5rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: .9rem;
    }

    /* ── ARTICLE OUTPUT ── */
    #article-output {
      font-family: 'Georgia', serif;
      font-size: 1.05rem;
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #article-output h1, #article-output h2, #article-output h3 {
      color: var(--gold);
      margin: 1.2em 0 .5em;
      font-size: 1.5rem;
    }

    /* ── STREAMING STATUS ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: .75rem;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 1rem;
      font-family: 'Arial', sans-serif;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #333;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      background: var(--surface);
      color: var(--gold-light);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: .1rem .5rem;
      font-size: .8rem;
      font-family: 'Arial', sans-serif;
      vertical-align: middle;
    }

    /* ── HISTORY TABLE ── */
    table { width: 100%; border-collapse: collapse; font-family: 'Arial', sans-serif; }
    th { text-align: left; color: var(--gold); font-size: .85rem; padding: .5rem .75rem;
         border-bottom: 1px solid var(--gold); }
    td { padding: .6rem .75rem; border-bottom: 1px solid #2a2a4a; font-size: .9rem;
         vertical-align: top; }
    tr:hover td { background: #1a1a35; }

    /* ── COPY BUTTON ── */
    #copy-btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: var(--radius);
      padding: .4rem 1rem;
      font-size: .85rem;
      cursor: pointer;
      font-family: 'Arial', sans-serif;
      transition: background .2s;
    }
    #copy-btn:hover { background: var(--gold); color: #000; }

    /* ── TOPIC TAG ── */
    .topic-tag {
      background: linear-gradient(90deg, var(--surface), var(--mid));
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      padding: .8rem 1.2rem;
      margin-bottom: 1.5rem;
      font-family: 'Arial', sans-serif;
    }
    .topic-tag .label { font-size: .75rem; color: var(--muted); text-transform: uppercase;
                        letter-spacing: .1em; }
    .topic-tag .value { font-size: 1.1rem; color: var(--gold-light); font-weight: bold;
                        margin-top: .2rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <div class="brand">&#9830; Blog<span>Copier</span></div>
  <ul>
    <li><a href="{% url 'generator:index' %}">Generate</a></li>
    <li><a href="{% url 'generator:history' %}">History</a></li>
  </ul>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
