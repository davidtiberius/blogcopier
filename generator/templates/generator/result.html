{% extends "generator/base.html" %}

{% block title %}Generated Article — BlogCopier{% endblock %}

{% block head %}
<style>
  /* Markdown-like rendering for the article output */
  #article-output { min-height: 200px; }

  /* Rendered markdown styles */
  .rendered h1 { font-size: 1.8rem; color: var(--gold); margin: 1.2em 0 .5em; }
  .rendered h2 { font-size: 1.4rem; color: var(--gold-light); margin: 1em 0 .4em; }
  .rendered h3 { font-size: 1.15rem; color: var(--gold-light); margin: .9em 0 .3em; }
  .rendered p  { margin-bottom: 1em; }
  .rendered ul, .rendered ol { padding-left: 1.4rem; margin-bottom: 1em; }
  .rendered li { margin-bottom: .3em; }
  .rendered strong { color: #fff; }
  .rendered em { color: var(--gold-light); }
  .rendered blockquote {
    border-left: 3px solid var(--gold);
    padding-left: 1rem;
    color: var(--muted);
    font-style: italic;
    margin: 1em 0;
  }
</style>
{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
  <h1 style="margin:0;">Generated Article</h1>
  <a href="{% url 'generator:index' %}" class="btn" style="font-size:.85rem; padding:.5rem 1.2rem;">
    ← New Generation
  </a>
</div>

<!-- Topic Badge -->
<div class="topic-tag">
  <div class="label">Selected jewellery topic</div>
  <div class="value" id="topic-display">{{ generation.jewelry_topic }}</div>
</div>

<!-- Status bar -->
<div class="status-bar" id="status-bar">
  <div class="spinner" id="spinner"></div>
  <span id="status-text">Generating article…</span>
</div>

<!-- Controls -->
<div style="display:flex; gap:.75rem; margin-bottom:1rem; align-items:center;">
  <button id="copy-btn" style="display:none;" onclick="copyArticle()">
    &#128203; Copy article
  </button>
  <a href="{% url 'generator:history' %}" style="font-size:.85rem; color:var(--muted);">
    View history
  </a>
</div>

<!-- Article output -->
<div class="card" id="output-card">
  <div id="article-output" class="rendered"></div>
</div>

<script>
  const generationId = {{ generation.id }};
  const outputEl     = document.getElementById('article-output');
  const statusBar    = document.getElementById('status-bar');
  const statusText   = document.getElementById('status-text');
  const spinner      = document.getElementById('spinner');
  const copyBtn      = document.getElementById('copy-btn');

  let rawMarkdown = '';

  // ── Very lightweight Markdown → HTML renderer ──────────────────────────────
  function renderMarkdown(md) {
    let html = md
      // Escape HTML entities first
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      // Headings
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // Bold / italic
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      // Unordered lists (simple)
      .replace(/^\* (.+)$/gm, '<li>$1</li>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      // Numbered lists
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      // Blockquotes
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      // Double newline → paragraph break
      .replace(/\n\n+/g, '\n\n');

    // Wrap consecutive <li> in <ul>
    html = html.replace(/(<li>.*<\/li>\n?)+/g, match => `<ul>${match}</ul>`);

    // Paragraphs: lines not starting with a block element
    const lines = html.split('\n');
    const result = [];
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) { result.push(''); continue; }
      if (/^<(h[1-6]|ul|ol|li|blockquote|hr)/.test(trimmed)) {
        result.push(trimmed);
      } else {
        result.push(`<p>${trimmed}</p>`);
      }
    }
    return result.join('\n');
  }

  // ── Server-Sent Events ──────────────────────────────────────────────────────
  const evtSource = new EventSource(`/stream/${generationId}/`);

  evtSource.onmessage = function(e) {
    const data = e.data;

    if (data === '[DONE]') {
      evtSource.close();
      spinner.style.display = 'none';
      statusText.textContent = 'Article generated successfully ✓';
      copyBtn.style.display  = 'inline-block';
      return;
    }

    let parsed;
    try { parsed = JSON.parse(data); } catch { return; }

    if (parsed.error) {
      spinner.style.display = 'none';
      statusText.textContent = '⚠ Error: ' + parsed.error;
      statusBar.style.color  = '#f39898';
      return;
    }

    if (parsed.text !== undefined) {
      rawMarkdown += parsed.text;
      outputEl.innerHTML = renderMarkdown(rawMarkdown);
      // Scroll to bottom of article as it streams
      outputEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  };

  evtSource.onerror = function() {
    evtSource.close();
    statusText.textContent = 'Connection lost. Please refresh if the article is incomplete.';
    spinner.style.display  = 'none';
  };

  // ── Copy to clipboard ───────────────────────────────────────────────────────
  function copyArticle() {
    navigator.clipboard.writeText(rawMarkdown).then(() => {
      copyBtn.textContent = '✓ Copied!';
      setTimeout(() => { copyBtn.textContent = '📋 Copy article'; }, 2000);
    });
  }
</script>
{% endblock %}
